name: provael-task-controls

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publisher-control-reader:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: provael/provael
          ref: f1dbc5352bfa7774c0a5599eff20407125914c78
          path: .provael-source
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - name: Install the pinned test runtime
        run: python -m pip install pytest==9.1.1 hypothesis==6.168.3
      - name: Test exact task draws, native pairing, source changes and missing provenance
        env:
          PROVAEL_SOURCE_ROOT: .provael-source
        run: python -m pytest -q tests/test_provael_controls.py
      - name: Read the publisher reports and retain every complete bound source file
        run: |
          python tools/check_provael_controls.py \
            --source-root .provael-source \
            --expect examples/provael-task-controls/report.json \
            --output provael-control-report.json \
            --retain-source-zip provael-required-source.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: provael-publisher-control-reader
          path: |
            provael-control-report.json
            provael-required-source.zip
            tools/check_provael_controls.py
            examples/provael-task-controls/contract.json
            examples/provael-task-controls/source-record.json
            examples/provael-task-controls/PROVAEL-LICENSE
            examples/provael-task-controls/PROVAEL-NOTICE
