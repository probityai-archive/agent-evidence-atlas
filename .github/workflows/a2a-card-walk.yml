name: a2a-card-walk

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retained-walk-rechecks-offline:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: interop/a2a-card-walk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.24"
      - name: Install the hash-pinned walk dependencies
        run: |
          uv venv --python 3.14.7 .venv
          uv pip install --python .venv/bin/python --require-hashes --only-binary=:all: -r requirements.txt
      - name: Lint and test the walk, tampering controls included
        run: |
          .venv/bin/ruff check walk.py test_walk.py
          .venv/bin/ruff format --check walk.py test_walk.py
          .venv/bin/python -m coverage run --source=walk -m pytest -q test_walk.py
          .venv/bin/python -m coverage report --fail-under=80
      - name: Re-check every retained walk offline
        run: |
          for directory in retained/*/; do
            .venv/bin/python walk.py verify "$directory"
          done
