name: board-run

# The Verified runner of the conformance board. A maintainer dispatches it with an
# entry name after reviewing the entry's pinned commit. Three jobs, so the key and the
# implementation never share a job:
#   plan  reads board/entries/<entry>/entry.toml
#   run   builds the implementation at its pinned commit and replays each corpus
#         through the agent-evidence-vectors Action; no secrets, read-only token
#   sign  downloads only the reports, re-checks them against the pinned corpus
#         digests and signs them with the board runner key; it never runs entry code
# The signed records are uploaded as the board-records artifact. Commit them under
# board/entries/<entry>/ in a pull request; the site build re-verifies them.

on:
  workflow_dispatch:
    inputs:
      entry:
        description: "Directory name under board/entries/"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: board-run-${{ inputs.entry }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      repository: ${{ steps.plan.outputs.repository }}
      commit: ${{ steps.plan.outputs.commit }}
      toolchain: ${{ steps.plan.outputs.toolchain }}
      toolchain_version: ${{ steps.plan.outputs.toolchain_version }}
      build: ${{ steps.plan.outputs.build }}
      verifier: ${{ steps.plan.outputs.verifier }}
      release: ${{ steps.plan.outputs.release }}
      tier: ${{ steps.plan.outputs.tier }}
      corpora: ${{ steps.plan.outputs.corpora }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install board verification
        run: python3 -m pip install -r requirements/board.txt
      - name: Read the entry
        id: plan
        env:
          ENTRY: ${{ inputs.entry }}
        run: |
          set -euo pipefail
          python3 tools/board.py plan "$ENTRY" >> "$GITHUB_OUTPUT"
          python3 tools/board.py plan "$ENTRY"
      - name: Refuse a Community entry
        if: steps.plan.outputs.tier != 'verified'
        run: |
          echo "::error::only an entry with tier = \"verified\" is run by the board runner"
          exit 1

  run:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        corpus: ${{ fromJSON(needs.plan.outputs.corpora) }}
    steps:
      - name: Check out the implementation at its pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.plan.outputs.repository }}
          ref: ${{ needs.plan.outputs.commit }}
          path: impl
          persist-credentials: false
      - name: Confirm the checked-out commit
        env:
          COMMIT: ${{ needs.plan.outputs.commit }}
        run: test "$(git -C impl rev-parse HEAD)" = "$COMMIT"
      - if: needs.plan.outputs.toolchain == 'go'
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: ${{ needs.plan.outputs.toolchain_version }}
          cache: false
      - if: needs.plan.outputs.toolchain == 'python'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ needs.plan.outputs.toolchain_version }}
      - if: needs.plan.outputs.toolchain == 'node'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ needs.plan.outputs.toolchain_version }}
      - name: Build the implementation
        if: needs.plan.outputs.build != ''
        working-directory: impl
        env:
          BUILD: ${{ needs.plan.outputs.build }}
        run: bash -euo pipefail -c "$BUILD"
      - name: Record the start time
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Replay the corpus
        id: replay
        continue-on-error: true
        uses: probityai/agent-evidence-vectors@a5e3d9a6e9f61b9f485c9dd7b174d55f9f1c59e4 # v0.19.0
        with:
          verifier: ./impl/${{ needs.plan.outputs.verifier }}
          corpus: ${{ matrix.corpus }}
          tag: v${{ needs.plan.outputs.release }}
          artifact-name: board-report-${{ matrix.corpus }}-harness
          report-path: ${{ matrix.corpus }}.report.json
      - name: Keep the report and its run time
        env:
          CORPUS: ${{ matrix.corpus }}
          STARTED: ${{ steps.started.outputs.at }}
        run: |
          set -euo pipefail
          test -s "$CORPUS.report.json"
          mkdir -p out
          cp "$CORPUS.report.json" out/
          printf '%s\n' "$STARTED" > "out/$CORPUS.started"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: board-report-${{ matrix.corpus }}
          path: out/
          retention-days: 30

  sign:
    needs: [plan, run]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install board verification
        run: python3 -m pip install -r requirements/board.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: board-report-*
          path: reports
          merge-multiple: true
      - name: Sign each report
        env:
          ENTRY: ${{ inputs.entry }}
          CORPORA: ${{ needs.plan.outputs.corpora }}
          BOARD_RUNNER_KEY: ${{ secrets.BOARD_RUNNER_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p records
          for corpus in $(python3 -c 'import json,os; print(" ".join(json.loads(os.environ["CORPORA"])))'); do
            cp "reports/$corpus.report.json" "records/$corpus.report.json"
            python3 tools/board_sign.py --entry "board/entries/$ENTRY/entry.toml" --corpus "$corpus" \
              --report "records/$corpus.report.json" --run-url "$RUN_URL" \
              --started-at "$(cat "reports/$corpus.started")" \
              --key-env BOARD_RUNNER_KEY --keyid board-runner-2026-10 --out "records/$corpus.dsse.json"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: board-records
          path: records/
          retention-days: 90
