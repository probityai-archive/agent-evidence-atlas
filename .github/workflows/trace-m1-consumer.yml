name: trace-m1-consumer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-inputs-and-consumer-controls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.24"
      - name: Fetch immutable inputs and run the original consumer
        run: bash interop/trace-m1/scripts/qualify.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: trace-m1-native-results
          path: |
            interop/trace-m1/results/qualification/
            interop/trace-m1/results/replay-r1/public-report.json
